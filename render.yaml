# Render Blueprint. NOTE: a persistent disk requires a paid instance type.
# On the free tier the SQLite file is wiped on redeploy/restart (use Export/Import in the Memory panel as backup).
services:
  - type: web
    name: rem-ai-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: rem-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: REM_DB_PATH
        value: /data/rem_memory.db
      - key: GEMINI_API_KEY
        sync: false
      - key: REM_ACCESS_CODE
        sync: false
      - key: REM_ALLOWED_ORIGINS
        sync: false
